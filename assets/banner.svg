<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Radial Glow Filters -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <filter id="glowLight">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 25px) scale(0.95); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -80; }
      }
      @keyframes orbOrbit {
        0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
      }
      .glow-orb-1 {
        animation: floatSlow1 9s ease-in-out infinite;
      }
      .glow-orb-2 {
        animation: floatSlow2 11s ease-in-out infinite;
      }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: dashAnim 4s linear infinite;
      }
      .pulse-node {
        animation: pulseBeam 3s ease-in-out infinite;
      }
      .tech-pill {
        transition: transform 0.3s ease;
      }
      .tech-pill:hover {
        transform: translateY(-3px);
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <g class="glow-orb-1" style="transform-origin: 200px 100px;">
    <circle cx="220" cy="110" r="160" fill="url(#cyanGlow)" filter="url(#blurFilter)" />
  </g>
  <g class="glow-orb-2" style="transform-origin: 980px 300px;">
    <circle cx="980" cy="300" r="180" fill="url(#purpleGlow)" filter="url(#blurFilter)" />
  </g>
  <circle cx="600" cy="380" r="140" fill="url(#pinkGlow)" filter="url(#blurFilter)" />

  <!-- Animated Circuit & Data Lines (Background/Accents) -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" fill="none">
    <path class="circuit-line" d="M 50 80 L 300 80 L 380 140" />
    <path class="circuit-line" d="M 1150 100 L 920 100 L 840 160" />
    <path class="circuit-line" d="M 100 360 L 320 360 L 400 300" />
    <path class="circuit-line" d="M 1100 340 L 880 340 L 800 280" />
  </g>

  <!-- Dynamic Particle Nodes -->
  <circle cx="380" cy="140" r="4" fill="#38bdf8" class="pulse-node" filter="url(#glowLight)" />
  <circle cx="840" cy="160" r="4" fill="#c084fc" class="pulse-node" filter="url(#glowLight)" />
  <circle cx="400" cy="300" r="4" fill="#818cf8" class="pulse-node" filter="url(#glowLight)" />
  <circle cx="800" cy="280" r="4" fill="#f472b6" class="pulse-node" filter="url(#glowLight)" />

  <!-- Decorative Outer Frame Border with Gradient Accents -->
  <rect x="20" y="20" width="1160" height="380" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#818cf8" stroke-width="3" />
  <path d="M 20 380 L 20 400 L 60 400" fill="none" stroke="#c084fc" stroke-width="3" />
  <path d="M 1140 400 L 1180 400 L 1180 360" fill="none" stroke="#f472b6" stroke-width="3" />

  <!-- Badge / Pill: Ecosystem Status (Foreground) -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- FOREGROUND TEXT ELEMENTS (Protected from obscuring) -->
  <!-- Main Title -->
  <g id="main-title">
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#glowLight)">
      Awesome AI Code Generation
    </text>
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
      &amp; Developer Tools
    </text>
  </g>

  <!-- Subtitle -->
  <g id="sub-title">
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="400" fill="url(#subGrad)">
      Autonomous Coding Agents • AI-Native IDEs • Local LLM Bridges • Code Completion Engines
    </text>
  </g>

  <!-- Interactive / Decorative Ecosystem Pills (Foreground Bottom) -->
  <g transform="translate(140, 285)">
    <!-- Pill 1: Cursor -->
    <g class="tech-pill" transform="translate(0, 0)">
      <rect width="130" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="65" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Cursor</text>
    </g>
    <!-- Pill 2: Copilot -->
    <g class="tech-pill" transform="translate(150, 0)">
      <rect width="140" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="70" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Copilot</text>
    </g>
    <!-- Pill 3: Windsurf -->
    <g class="tech-pill" transform="translate(310, 0)">
      <rect width="140" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="70" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏄 Windsurf</text>
    </g>
    <!-- Pill 4: Cline -->
    <g class="tech-pill" transform="translate(470, 0)">
      <rect width="130" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" />
      <text x="65" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛠️ Cline</text>
    </g>
    <!-- Pill 5: Aider -->
    <g class="tech-pill" transform="translate(620, 0)">
      <rect width="130" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="65" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 Aider</text>
    </g>
    <!-- Pill 6: OpenHands -->
    <g class="tech-pill" transform="translate(770, 0)">
      <rect width="150" height="38" rx="19" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="75" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🙌 OpenHands</text>
    </g>
  </g>

  <!-- Sub-footer Tagline -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
    ENTERPRISE SAAS LEADERS • PRIVACY-FIRST RUNTIMES • OPEN-SOURCE AGENTS
  </text>
</svg>
